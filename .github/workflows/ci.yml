name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, type-check, test, package, site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The packages first: the tests import their built dist
      - name: Build packages
        run: pnpm build

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Smoke tests (built packages load through their exports)
        run: pnpm test:smoke

      - name: LICENSE parity
        # npm only packs files inside the package, so each package carries a copy of the root LICENSE.
        run: |
          for copy in packages/core/LICENSE packages/react/LICENSE packages/angular/projects/grid-angular/LICENSE; do
            cmp LICENSE "$copy" || { echo "::error file=$copy::$copy differs from the root LICENSE"; exit 1; }
          done

      - name: Inspect package contents
        run: pnpm pack:check

      - name: Build the demo site
        run: |
          pnpm --filter @dash-builder/site build:site
          pnpm --filter @dash-builder/site check
