name: Release

# Changesets release flow for @dash-builder/core, @dash-builder/angular and @dash-builder/react.
#
# On every push to main: if changesets are pending, open or update the "Version Packages" PR
# (versions + CHANGELOGs). When that PR is merged, the same job publishes every package whose
# version is not on npm yet, then tags the release.
#
# Auth: npm trusted publishing (OIDC) — no npm token is stored anywhere. Each package's trusted
# publisher on npmjs.com (package → Settings → Trusted Publisher) must name GitHub owner
# "Constantine-24", repository "dash-builder", workflow file "release.yml", no environment, and
# allow direct publishing. changesets/action skips writing an .npmrc when OIDC is available, and
# pnpm performs the OIDC exchange itself. Trusted publishers can only be added to packages that
# already exist, so the very first version of each package is published by hand — see
# CONTRIBUTING.md.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open the Version Packages PR
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    # Forks must not open Version PRs or try to publish
    if: github.repository == 'Constantine-24/dash-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # npm's guidance: never cache dependencies in release builds

      - run: pnpm install --frozen-lockfile

      - name: Version Packages PR, or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
