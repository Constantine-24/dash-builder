name: Bug report
description: Something in dash-builder doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! A minimal reproduction (StackBlitz or a small repo) gets it fixed fastest.
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options: ['@dash-builder/core', '@dash-builder/angular', '@dash-builder/react', 'Demo site / docs']
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        [
          Drag and drop (drop modes),
          Resize,
          Locked widgets / drag handles,
          Row limit,
          Narrow (stacked) view,
          Touch input,
          Layout JSON,
          Styling / theming,
          Other,
        ]
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link to a StackBlitz / repo, or the smallest code that shows the problem, including the layout JSON and options.
      render: tsx
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: '@dash-builder/* packages, and @angular/core or react if relevant'
      placeholder: '@dash-builder/core 0.1.0, @dash-builder/react 0.1.0, react 19.3.1'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS & input
      placeholder: Chrome 141, macOS 26, mouse
